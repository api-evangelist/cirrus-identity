name: Cirrus Identity
description: >-
  Cirrus Identity provides managed identity and access management for higher education,
  connecting modern identity providers, federations, and legacy systems to standardize
  authentication across campus environments without replacing existing infrastructure.
  Its products include Cirrus Bridge (multilateral SAML & CAS for Entra ID, Okta, and
  Duo SSO), External User Sign-In, Trusted Federation & Affiliates Sign-In, a Slate
  applicant sign-in extension, and an Admin Console with event logs. Cirrus also publishes
  a REST Log API for programmatically retrieving authentication and service event logs,
  and maintains a suite of open-source SimpleSAMLphp modules on GitHub and Packagist.
